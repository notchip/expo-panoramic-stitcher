apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group = 'expo.modules.panoramicstitcher'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Manage Android SDK versions yourself (default Expo behaviour for modules).
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  buildscript {
    ext.safeExtGet = { prop, fallback ->
      rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
  }
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "expo.modules.panoramicstitcher"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    externalNativeBuild {
      cmake {
        // Match the STL the OpenCV AAR was built with (prefab abi.json: c++_shared).
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  buildFeatures {
    // Consume the C++ headers + libopencv_java4.so exported by the OpenCV AAR.
    prefab true
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  packagingOptions {
    jniLibs {
      // The OpenCV AAR already ships libc++_shared.so per ABI; excluding our copy
      // avoids "2 files found" merge errors in consuming apps.
      excludes += ["**/libc++_shared.so"]
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // OpenCV from Maven Central (official, since 4.9). Bundles the native .so libs
  // automatically — no manual SDK download, no jniLibs.srcDirs. NOTE: the AAR's
  // Java/Kotlin bindings do NOT wrap the stitching module (upstream wraps it for
  // Python only), so stitching goes through the small JNI shim in src/main/cpp/,
  // compiled against the AAR's prefab C++ headers.
  implementation 'org.opencv:opencv:4.13.0'
}
